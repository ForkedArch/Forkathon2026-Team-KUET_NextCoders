<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
    
</head>

    <style>
        body {
            background-image: url("./assets/images/Background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>

    
        <!-- Login Page -->
<div id="loginPage" class="page">
    <div class="login-container">

        <img src="./assets/icons/KontaKar_logo.jpeg" width="100" height="100">
        <h1>Campus Lost & Found</h1>

        <p>Enter your information to continue</p>

        <div class="input-group">
            <label for="studentId">Student ID</label>
            <input 
                type="text" 
                id="studentId" 
                placeholder="Enter your student ID"
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
            >
        </div>

        <div class="action-buttons">
            <button class="found-btn" onclick="handleLogin('found')">
                I Found Something
            </button>

            <button class="lost-btn" onclick="handleLogin('lost')">
                I Lost Something
            </button>
        </div>
    </div>
</div>


<!-- Found Item Page -->
<div id="foundItemPage" class="page">

    <div class="form-container">

        <h1>Report Found Item</h1>
        <p>Provide details about the item you found</p>


        <!-- Item Name -->
        <div class="input-group">
            <label for="foundItemName">Item Name</label>
            <input 
                type="text" 
                id="foundItemName"
                placeholder="Example: Wallet, Phone, Bag"
            >
        </div>


        <!-- Location -->
        <div class="input-group">
            <label for="foundLocation">Location</label>
            <input 
                type="text" 
                id="foundLocation"
                placeholder="Where did you find it?"
            >
        </div>


        <!-- Contact -->
        <div class="input-group">
            <label for="foundContact">Contact Number</label>
            <input 
                type="tel" 
                id="foundContact"
                placeholder="A number the owner can reach you on"
            >
        </div>
 

        <!-- Feature 1 -->
        <div class="feature-section">

            <label>Feature 1</label>

            <div class="feature-row">
                <select id="feature1Name">
                    <option value="">Select Property</option>
                    <option value="Color">Color</option>
                    <option value="Logo">Logo</option>
                    <option value="Size">Size</option>
                    <option value="Company">Company</option>
                    <option value="Material">Material</option>
                    <option value="Model">Model</option>
                </select>

                <input 
                    type="text"
                    id="feature1Value"
                    placeholder="Enter value"
                >
            </div>

        </div>



        <!-- Feature 2 -->
        <div class="feature-section">

            <label>Feature 2</label>

            <div class="feature-row">
                <select id="feature2Name">
                    <option value="">Select Property</option>
                    <option value="Color">Color</option>
                    <option value="Logo">Logo</option>
                    <option value="Size">Size</option>
                    <option value="Company">Company</option>
                    <option value="Material">Material</option>
                    <option value="Model">Model</option>
                </select>

                <input 
                    type="text"
                    id="feature2Value"
                    placeholder="Enter value"
                >
            </div>

        </div>



        <!-- Feature 3 -->
        <div class="feature-section">

            <label>Feature 3</label>

            <div class="feature-row">
                <select id="feature3Name">
                    <option value="">Select Property</option>
                    <option value="Color">Color</option>
                    <option value="Logo">Logo</option>
                    <option value="Size">Size</option>
                    <option value="Company">Company</option>
                    <option value="Material">Material</option>
                    <option value="Model">Model</option>
                </select>

                <input 
                    type="text"
                    id="feature3Value"
                    placeholder="Enter value"
                >
            </div>

        </div>



        <!-- Submit -->
        <button class="submit-btn" onclick="submitFoundItem()">
            Submit Found Item
        </button>


    </div>

</div>


<!-- Feed Page -->
<div id="feedPage" class="page">

    <div class="feed-container">

        <h1 id="feedHeading">Found Items Feed</h1>

        <ul class="item-list" id="itemList">
            <!-- Items are loaded here from the JSON server -->
        </ul>

    </div>

</div>




<!-- Claim Verification Popup -->

<div id="claimPopup" class="popup">

    <div class="popup-content">

        <span class="close-btn" onclick="closeClaimPopup()">
            ×
        </span>


        <h2>Claim Item Verification</h2>


        <div class="input-group">

            <label>Item Name</label>

            <input 
                type="text" 
                id="claimItemName"
                readonly
            >

        </div>



        <div class="input-group">

            <label>Location</label>

            <input 
                type="text"
                id="claimLocation"
                readonly
            >

        </div>



        <h3>Verify Item Features</h3>


        <div id="featureQuestions">

            <!-- Features will be generated here -->

        </div>



        <button 
            class="submit-btn"
            onclick="verifyClaim()">

            Verify

        </button>


    </div>

</div>


<!-- Respond Popup (Found flow) -->

<div id="respondPopup" class="popup">

    <div class="popup-content">

        <span class="close-btn" onclick="closeRespondPopup()">
            ×
        </span>


        <h2>Item Details</h2>


        <div class="input-group">

            <label>Item Name</label>

            <input 
                type="text" 
                id="respondItemName"
                readonly
            >

        </div>



        <div class="input-group">

            <label>Location</label>

            <input 
                type="text"
                id="respondLocation"
                readonly
            >

        </div>



        <h3>Features</h3>

        <ul id="respondFeatureList"></ul>



        <div class="contact-info">

            <p>Contact number of the person who reported losing this item:</p>

            <p><strong id="respondContactNumber"></strong></p>

        </div>


    </div>

</div>

    <script type="module" src="js/app.js"></script>

    </body>
</html>
